<!DOCTYPE html>
<html>
    <head>
        <title>Ordered List</title>
    </head>
    <body>
        <h1><span style="color:red;(255, 153, 0);">Ordered List</span></h1>
        <div>
        <ol>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ol>
        </div>
        <div>
        <ol type="A">
            <li>Item A</li>
            <li>Item B</li>
            <li>Item C</li>
        </ol>
        </div>
        <div>
        <ol type="a">   
            <li>Item a</li>
            <li>Item b</li>
            <li>Item c</li>
        </ol>
        </div>
        <div>
        <ol type="I">
            <li>Item I</li>
            <li>Item II</li>
            <li>Item III</li>   
        </ol>
        </div>
        <div>
        <ol type="i">
            <li>Item i</li>
            <li>Item ii</li>
            <li>Item iii</li>
        </ol>
        </div>
        <div>
        <ol start="5">
            <li>Item 5</li>
            <li>Item 6</li>
            <li>Item 7</li>
        </ol>
        </div>  
    </body>
</html>
