<!DOCTYPE html>
<html>
    <head>
        <title>Image and Audio Tags</title>
    </head>
    <body>
        <h1><span style="color: rgba(145, 255, 0, 0.36);">Image Tags</span></h1>
        <div>
            <img src="./img2.png" alt="Sample Image" width="300" height="200">
        </div>
        <hr/>
        <div>
            <h1><span style="color: rgba(255, 0, 0, 0.644);">Audio Tag</span></h1>
            <audio controls>
                <source src="./au1.mpeg" type="audio/mpeg">
                Your browser does not support the audio tag.
            </audio>
        </div>
    </body>
</html>
