<!DOCTYPE html>
<html>
    <head>
        <title>Unordered List</title>
    </head>
    <body>
        <h1><span style="color: red;(255, 153, 0);">Unordered List</span></h1>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
        <ul type="circle">
            <li>Item A</li>
            <li>Item B</li>
            <li>Item C</li>
        </ul>
        <ul type="square">
            <li>Item X</li>
            <li>Item Y</li>
            <li>Item Z</li>
        </ul>   
        <ul type="disc ">
            <li>Item Alpha</li>
            <li>Item Beta</li>
            <li>Item Gamma</li>
        </ul>
    </body>
</html>
