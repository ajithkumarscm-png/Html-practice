<!DOCTYPE html>
<html>
    <head>
        <title>global attributes</title>
    </head>
    <body>
        
        <h1><span style="color: rgb(0, 225, 255);">Tabindex tag</span></h1>
        <div>
            <p tabindex="1" aria-label="this is hello world" >Ferrari</p> 
              <p tabindex="2" aria-label="this is welcome world" >Porsche </p>

            <p tabindex="3" aria-label="this is goodbye world" > Jaguar</p>
        </div>
    </body>
</html>
