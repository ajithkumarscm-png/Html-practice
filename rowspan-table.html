<!DOCTYPE html>
<html>
    <head>
        <title>Table Border Example</title>
    </head>
    <body>
        <h1><span style="color: rgb(0, 255, 251);">Table rowspan Example</span></h1>
        <table border="3" width="75%" height="75%" align="center">
            <tr>
                <th rowspan="2">Sr.No</th>
                <th rowspan="2">student name</th>
                <th colspan="5">subject marks</th>
            </tr>
            <tr>
            
                <th>Tamil</th>
                <th>English</th>
                <th>Maths</th>
                <th>Science</th>
                <th>Sst</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Kabil</td>
                <td>55</td>
                <td>60</td>
                <td>76</td>
                <td>84</td>
                <td><span style="color:red;">34</span></td>
            </tr>
            <tr>
                <td>2</td>
                <td rowspan="2">S Mani</td>   
                <td>64</td>
                <td>70</td>
                <td>85</td>
                <td>92</td>
                <td>100</td>
            </tr>
            <tr>
                <td>3</td>
                <td>71</td>
                <td>87</td>
                <td>93</td>
                <td><span style="color: red;(255,0,21);">29</span></td>
                <td>85</td>

            </tr>
        </table><br>
        <a href="./colspan-table.html">Click here to see the table with colspan</a>

    </body>
</html>
