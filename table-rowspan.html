<!DOCTYPE html>
<html>
    <head>
        <title>Table Border Example</title>
        <style>
            th,td{ 
                text-align: center;
            }
        </style>
    </head>
    <body>
        <a href="./table-task.html"><img src="./pre.png" alt="previous" width="75px" height="75px"></a>
        <h1><span style="color: rgb(170, 0, 255);">Rowspan Table</span></h1>
        <table border="3" width="75%" height="75%" align="center">
            <tr>
                <th>Sr. No</th>
                <th>Name</th>
                <th>Company Name</th>
                <th> Dept </th>
                <th>Gender</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Hari</td>
                <td>Tcs</td>
                <td>Testing</td>
                <td>Male</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Ram</td>
                <td>Cts</td>
                <td>Developer</td>
                <td>Male</td>
            </tr>
            <tr>
                <td>3</td>
                <td rowspan="2">Jeni</td>   
                <td>Hcl</td>
                <td>Analyst</td>
                <td>Female</td>
            </tr>
            <tr>
                <td>4</td>
               
                <td>Zoho</td>
                <td>Developer</td>
                <td>Female</td>

            </tr>
        </table><br>
        
            <center>
        <a href="./table-colspan.html"><img src="./next.png" alt="next" width="75px" height="75px"> </a>
        </center>
        
    </body>
</html>
